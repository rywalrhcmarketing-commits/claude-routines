# Project-wide Gradle settings.

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Build performance
# 3072m, nie 2048m: od dodania lokalnego modelu AI (siedem wariantów .so
# dla różnych ABI/rozszerzeń CPU llama.cpp) kaptDebugKotlin zaczął padać
# bez żadnego czytelnego wyjątku - klasyczny objaw zabicia workera przez
# brak pamięci, nie błędu kompilacji.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Android build
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
