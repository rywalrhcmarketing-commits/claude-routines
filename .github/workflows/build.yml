name: Build Jarvis

on:
  push:
    branches:
      - claude/jarvis-ai-glasses-project-zxsabo
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runnery ubuntu-latest mają Android SDK preinstalowany,
      # a ANDROID_HOME jest ustawione - local.properties nie jest potrzebne.
      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version

      - name: Build debug APK
        working-directory: jarvis-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Bez tego log tonie w stack trace Gradle'a - tu zostaje sama treść błędów.
      - name: Podsumowanie błędów
        if: failure()
        run: |
          echo "======== BŁĘDY KOMPILACJI: $(grep -c '^e: ' build.log || echo 0) ========"
          grep -E "^e: " build.log | head -200 || echo "(brak)"
          echo
          echo "======== BŁĘDY ZASOBÓW / MANIFESTU ========"
          grep -E "error:|Error:|AAPT|Manifest merger" build.log | head -30 || echo "(brak)"
          echo
          echo "======== NIEUDANE ZADANIA ========"
          grep -E "> Task .* FAILED|What went wrong|Execution failed|Could not find|Could not resolve" build.log | head -20 || echo "(brak)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Run unit tests
        if: success()
        working-directory: jarvis-app
        run: ./gradlew testDebugUnitTest --no-daemon
