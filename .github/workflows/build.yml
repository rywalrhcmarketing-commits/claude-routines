name: Build Jarvis

on:
  push:
    branches:
      - claude/jarvis-ai-glasses-project-zxsabo
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runnery ubuntu-latest mają Android SDK preinstalowany,
      # a ANDROID_HOME jest ustawione - local.properties nie jest potrzebne.
      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version

      - name: Build debug APK
        working-directory: jarvis-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Run unit tests
        if: success()
        working-directory: jarvis-app
        run: ./gradlew testDebugUnitTest --no-daemon
